server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: ogni rotta sconosciuta torna a index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset statici con hash nel nome: cache lunga e immutabile
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
